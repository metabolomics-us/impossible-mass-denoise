# denoise.mcp.metabolomics.us -- the MCP endpoint (Model Context Protocol, streamable HTTP).
#
# Serves the `denoise_mcp` server (systemd: denoise-mcp.service) on 127.0.0.1:8301. The REST API
# and the web page are a separate vhost (denoise.mcp.metabolomics.us serves /api and /).
#
# Everything unusual here is because an MCP session is a long-lived streamed response, not a
# request/response pair: tool calls can run for tens of seconds while peaks are explained, and
# progress notifications are pushed on the SSE stream while the call is still running. A proxy
# that buffers, or that times out at 60 s, turns streaming into a silent wait and then a 504.
#
# The server itself checks the Host header (it is started with --allowed-host
# denoise.mcp.metabolomics.us), so this vhost must send the public name, not $host as nginx
# defaults to when the request arrives by IP.

upstream denoise_mcp {
    server 127.0.0.1:8301;
    keepalive 8;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name denoise.mcp.metabolomics.us;

    # TLS lines (ssl_certificate, ssl_certificate_key, protocols) are the operator's to fill from
    # the house tls-common pattern, the same way denoise.metabolomics.us gets its certificate for
    # denoise.metabolomics.us. Nothing here is auth-related: the endpoint is read-only, sends no
    # caller data anywhere, and holds nothing, so it needs no client certificates and no tokens.

    # A spectrum is up to 5000 (m/z, intensity) pairs; the JSON of that is around 100 KB, and a
    # batch of 50 spectra is bigger. Refuse oversized bodies here rather than in the app.
    client_max_body_size 8m;

    location = /mcp {
        proxy_pass http://127.0.0.1:8301;
        proxy_http_version 1.1;

        # The MCP server refuses any other Host with HTTP 421; hand it the public name.
        proxy_set_header Host denoise.mcp.metabolomics.us;

        # Rate limiting and any abuse report must key on the real client, not on nginx.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: no buffering, no response caching, no transformation of the chunked stream.
        # `proxy_buffering off` also stops nginx waiting for a full buffer before the first byte,
        # which is what makes progress notifications arrive when the server writes them.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;

        # A long clean with explanations on a full 5000-peak spectrum, and an idle SSE keep-alive,
        # both need more than nginx's 60 s defaults.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        # MCP clients read the session id from this header; without it exposed a proxy that hides
        # headers would break session resumption.
        add_header Access-Control-Expose-Headers "Mcp-Session-Id, Last-Event-ID" always;
    }

    # Anything else on this host is not the MCP endpoint. Answer here rather than proxy it: an
    # unexpected path should not reach a server that only understands /mcp.
    location / {
        return 404 "denoise.mcp.metabolomics.us serves /mcp only\n";
    }
}

# Plain HTTP exists only to redirect; the MCP endpoint is never served over cleartext, because the
# Host allowlist the app enforces names the https name.
server {
    listen 80;
    listen [::]:80;
    server_name denoise.mcp.metabolomics.us;
    return 301 https://$host$request_uri;
}
