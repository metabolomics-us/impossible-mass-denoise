# /etc/nginx/conf.d/denoise-mcp.conf   on kvm-node-12 (whiteale, 128.120.143.172)
#
# denoise.mcp.metabolomics.us: the Model Context Protocol surface of the
# impossible-mass denoise filter (metabolomics-us/impossible-mass-denoise,
# denoise_mcp/), OPEN TO ANYONE by design -- no login, no token. Proxies /mcp and
# nothing else to denoise-mcp.service on 127.0.0.1:8301; every other path is a 404
# that points at the guide on the REST host. Names are prefixed `denoise_mcp_`
# (upstream/map/geo share one global namespace across conf.d). Distinct from
# denoise.conf (denoise.metabolomics.us, the REST API on kvm-node-7/8).
#
# nginx here is 1.20.1 (open source): no active health checks, `max_fails` is
# passive only. And there is no health route on the process: `/` and `/health` are
# both 404, because the host header guards run before routing and only /mcp is
# registered. Readiness is therefore a bounded POST (`tools/list`, or `service_info`
# for the fingerprint), never `GET /mcp` -- whose SSE Accept opens the notification
# stream and stays open, which a monitor would read as a timeout on a healthy unit.
#
# The certificate is an HTTP-01 webroot lineage (see roles/certbot): this file
# serves /.well-known/acme-challenge/ on :80, certbot-apptainer renews it as the
# certbot uid, and the deploy hook touches the stamp that reloads nginx. nginx
# will not load a 443 server whose certificate is missing, so first issuance
# happens against an :80-only copy of the first server block.
#
# Mirrored byte for byte from ops/deploy/nginx-denoise-mcp.conf in
# metabolomics-us/impossible-mass-denoise. Change one, change the other; the
# scripts/test-nginx-conf-d.sh gate here catches the one http-context rule that
# has already taken this host's whole proxy down once (limit_req_status).

# denoise.mcp.metabolomics.us -- the MCP endpoint (Model Context Protocol, streamable HTTP).
#
# Runs the `denoise_mcp` server (systemd: denoise-mcp.service) on 127.0.0.1:8301 and is its only
# public face: the app binds loopback, this terminates TLS, logs, and rate limits. The REST API and
# the web page are the separate `denoise.metabolomics.us` vhost, on other hosts; this host answers
# nothing but /mcp.
#
# House shape: same as conf.d/mcp.conf (mcp.metabolomics.us) and conf.d/flasheic.conf in the nginx
# role of fiehnlab-slurm-cluster, which have the same streaming problem. Put this file in that role's
# conf.d/ rather than hand-placing it: the role owns /etc/nginx/conf.d with purge enabled, so a file
# that exists only on the host is deleted by the next converge. Keep the two copies identical.
#
# Everything unusual here is because an MCP session is a long-lived streamed response rather than a
# request/response pair: a tool call can run for tens of seconds while peaks are explained, and
# progress notifications are pushed down the SSE stream while the call is still working. A proxy
# that buffers turns streaming into a silent wait, and a 60 s read timeout turns a long clean into
# a 504.

upstream denoise_mcp_backend {
    server 127.0.0.1:8301 max_fails=2 fail_timeout=15s;
    keepalive 16;
}

# Unauthenticated on purpose: the tools read the spectrum a caller sends and report on it, send it
# nowhere, and hold nothing. That makes this vhost's rate limit and log the whole security posture,
# so they are not optional. 120 r/m is a generous interactive session (initialize, tools/list, then
# about one request per tool call) with room for an agent that works in parallel; it refuses a
# hammering client instead of queueing everyone else behind it.
#
# $binary_remote_addr is the real client because nothing else proxies to this host. Put a CDN in
# front and this becomes the wrong key: everyone behind one edge address would share a budget.
limit_req_zone $binary_remote_addr zone=denoise_mcp:10m rate=120r/m;
# `limit_req_status 429` is deliberately NOT set here. conf.d files are included into one http
# context, the estate's flasheic-mcp.conf already sets that status at http level, and nginx refuses
# the same directive twice in one context -- `nginx -t` fails with "limit_req_status directive is
# duplicate" and the whole reverse proxy stops reloading, not just this vhost. The zone name is
# namespaced (denoise_*), which is why the zone itself can be declared here.

server {
    listen 80;
    listen [::]:80;
    server_name denoise.mcp.metabolomics.us;

    # Certificate issuance and renewal happen over HTTP-01 here, the way mcp.metabolomics.us and
    # masswiki.mcp.metabolomics.us get theirs: the unprivileged wrapper
    #   sudo -u certbot /usr/local/sbin/certbot-apptainer certonly --webroot \
    #       -w /var/lib/letsencrypt -d denoise.mcp.metabolomics.us
    # and the certbot-apptainer timer renews it, touching the stamp that reloads nginx. This
    # location has to answer before the 443 server below can exist, because nginx will not load a
    # 443 server whose certificate is missing.
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type "text/plain";
    }

    # The endpoint is never served over cleartext: the Host allowlist the app enforces names the
    # https address, and a spectrum is somebody's data.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name denoise.mcp.metabolomics.us;

    ssl_certificate     /etc/letsencrypt/live/denoise.mcp.metabolomics.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/denoise.mcp.metabolomics.us/privkey.pem;
    include conf.d/tls-common.inc;

    # A spectrum is up to 5000 (m/z, intensity) pairs, about 100 KB as JSON, and clean_batch takes
    # up to 200 of them. nginx refuses the oversized bodies here; the app refuses the ones that fit
    # but break its own limits, with a message that names the limit.
    client_max_body_size 8m;

    # Spectrum payloads are user data: log the request line, never the body.
    access_log /var/log/nginx/denoise-mcp.access.log;
    error_log  /var/log/nginx/denoise-mcp.error.log;

    location = /mcp {
        limit_req zone=denoise_mcp burst=40 nodelay;
        proxy_pass http://denoise_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The app refuses any other Host with HTTP 421 (DNS rebinding protection), so hand it the
        # public name it was started with rather than whatever the request arrived by.
        proxy_set_header Host denoise.mcp.metabolomics.us;

        # Abuse has to be attributable to the caller, not to nginx.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: pass bytes through as the server writes them. `proxy_buffering off` is what makes a
        # progress notification arrive when it is written rather than at the end; `no-cache` and
        # `no-transform` on the response are set by the app itself (X-Accel-Buffering: no).
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        # A full clean of a batch with explanations, and an idle SSE keep-alive, both outrun the
        # 60 s defaults.
        proxy_connect_timeout 5s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;

        # The server is stateless, so a second attempt on a restarted worker is a clean retry.
        proxy_next_upstream error timeout;
    }

    # Nothing else on this host is the MCP endpoint, and it must not reach a server that understands
    # only /mcp. The guide for connecting lives on the site host: https://denoise.metabolomics.us/mcp
    location / {
        return 404 "denoise.mcp.metabolomics.us serves /mcp only; the guide is at https://denoise.metabolomics.us/mcp\n";
    }
}